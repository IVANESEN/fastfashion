<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FastFashion: tu outfit en segundos, con lo que ya tienes en tu clóset.">
  <meta name="theme-color" content="#800020">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FastFashion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FastFashion</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #800020; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #800020; color: #fff; font: 800 28px/1 Poppins, 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: -0.04em; transition: opacity .25s ease;
    }
    #boot span { color: #2A0A12; }
    #boot.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">fastfashion<span>.</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.classList.add('done'); setTimeout(function () { b.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
